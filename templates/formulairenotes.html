{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter une note</title>

    <link rel="stylesheet" href="{% static 'css/formulaireadmin.css' %}?v=2.0">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h2>Ajouter une note</h2>


        <!-- Messages Django -->
        {% if messages %}
            <div class="messages-container">

                {% for message in messages %}

                    <div
                        class="alert alert-{{ message.tags }}"
                        style="color: green; margin-bottom: 15px; font-weight: bold;"
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- Étudiant -->
            <div class="form-group">

                <label for="etudiant">
                    Étudiant
                </label>

                <select name="etudiant" id="etudiant" required>

                    <option value="">
                        -- Sélectionner un étudiant --
                    </option>

                    {% for etudiant in etudiants %}

                        <option value="{{ etudiant.id }}">
                            {{ etudiant.nom }} {{ etudiant.prenom }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Matière -->
            <div class="form-group">

                <label for="matiere">
                    Matière
                </label>

                <select name="matiere" id="matiere" required>

                    <option value="">
                        -- Sélectionner une matière --
                    </option>

                    {% for matiere in matieres %}

                        <option value="{{ matiere.id }}">
                            {{ matiere.nom }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Note -->
            <div class="form-group">

                <label for="note">
                    Note
                </label>

                <input
                    type="number"
                    name="note"
                    id="note"
                    min="0"
                    max="20"
                    step="0.01"
                    placeholder="Exemple : 15.5"
                    required
                >

            </div>


            <!-- Boutons -->
            <div class="buttons">

                <button
                    type="submit"
                    class="btn-save"
                >
                    Enregistrer la note
                </button>


                <a
                    href="{% url 'gestion_notes' %}"
                    class="Retour"
                >
                    <ion-icon
                        name="arrow-back-outline"
                        class="rr">
                    </ion-icon>

                    Retour
                </a>

            </div>

        </form>

    </div>

</div>


<!-- Ionicons -->
<script
    type="module"
    src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
</script>

<script
    nomodule
    src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
</script>

</body>
</html>
