{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le rôle</title>

    <link rel="stylesheet" href="{% static 'css/formulaireadmin.css' %}">
</head>
<body>

<div class="container">

<div class="form-card">

<h2>Modifier le rôle de {{ user.username }}</h2>

        <form method="POST">

{% csrf_token %}

    <div class="form-group">
        <label>Nom d'utilisateur</label>
        {{ form.username }}
    </div>

    <div class="form-group">
        <label>Prenom</label>
        {{ form.first_name }}
    </div>

    <div class="form-group">
        <label>Nom</label>
        {{ form.last_name }}
    </div>

    <div class="form-group">
        <label>Email</label>
        {{ form.email }}
    </div>

    <div class="form-group">
    <label>Rôle</label>
    {{ form.role }}
    </div>

    <div class="buttons">

    <button type="submit" class="btn-save">Enregistrer</button>

    <a href="{% url 'gestion_utilisateurs' %}" class="Retour">
    <ion-icon name="arrow-back-outline" class="rr"></ion-icon> Retour</a>
</div>

    </form>

</div>

</div>

</body>
</html>
